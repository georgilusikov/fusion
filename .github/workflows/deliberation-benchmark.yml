name: Deliberation Benchmark

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of benchmark cases (use 40 for the full suite)"
        required: true
        default: "3"
      preset:
        description: "API-capable Fusion preset"
        required: true
        default: "mixed"
      baseline:
        description: "Single-model baseline member spec"
        required: true
        default: "or:anthropic/claude-opus-5"
      judge:
        description: "Fusion judge member spec"
        required: true
        default: "or:anthropic/claude-opus-5"
      drafter:
        description: "Fusion drafter member spec"
        required: true
        default: "or:anthropic/claude-opus-5"
      evaluators:
        description: "Comma-separated independent blind evaluator specs"
        required: true
        default: "or:openai/gpt-5.6-luna,or:google/gemini-3.1-pro-preview,or:deepseek/deepseek-v4-pro-0813"
      min_valid_evaluators:
        description: "Minimum valid evaluators per case"
        required: true
        default: "2"
      scouts:
        description: "Deliberation scouts"
        required: true
        default: "4"
      branches:
        description: "Bounded branch expansions"
        required: true
        default: "3"
      critics:
        description: "Targeted critics"
        required: true
        default: "2"
      min_quality_delta:
        description: "Minimum quality gain on the 0..5 scale for PROMOTE"
        required: true
        default: "0.10"
      min_win_rate_delta:
        description: "Minimum blind win-rate gain for PROMOTE"
        required: true
        default: "0.05"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require OpenRouter key
        shell: bash
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "OPENROUTER_API_KEY repository secret is required for this workflow." >&2
            exit 2
          fi

      - name: Validate benchmark configuration
        run: |
          python scripts/multi_eval_benchmark.py \
            --dry-run \
            --limit "${{ inputs.limit }}" \
            --preset "${{ inputs.preset }}" \
            --baseline "${{ inputs.baseline }}" \
            --judge "${{ inputs.judge }}" \
            --drafter "${{ inputs.drafter }}" \
            --evaluators "${{ inputs.evaluators }}" \
            --min-valid-evaluators "${{ inputs.min_valid_evaluators }}" \
            --scouts "${{ inputs.scouts }}" \
            --branches "${{ inputs.branches }}" \
            --critics "${{ inputs.critics }}"

      - name: Run blind multi-evaluator benchmark
        run: |
          python scripts/multi_eval_benchmark.py \
            --limit "${{ inputs.limit }}" \
            --preset "${{ inputs.preset }}" \
            --baseline "${{ inputs.baseline }}" \
            --judge "${{ inputs.judge }}" \
            --drafter "${{ inputs.drafter }}" \
            --evaluators "${{ inputs.evaluators }}" \
            --min-valid-evaluators "${{ inputs.min_valid_evaluators }}" \
            --scouts "${{ inputs.scouts }}" \
            --branches "${{ inputs.branches }}" \
            --critics "${{ inputs.critics }}" \
            --output benchmarks/deliberation_results.json

      - name: Evaluate promotion gate
        if: success()
        run: |
          python scripts/deliberation_gate.py \
            benchmarks/deliberation_results.json \
            --min-quality-delta "${{ inputs.min_quality_delta }}" \
            --min-win-rate-delta "${{ inputs.min_win_rate_delta }}" \
            > benchmarks/deliberation_gate.json

      - name: Write benchmark summary
        if: always()
        shell: bash
        run: |
          if [ ! -f benchmarks/deliberation_results.json ]; then
            echo "## Deliberation benchmark" >> "$GITHUB_STEP_SUMMARY"
            echo "No result file was produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          data = json.loads(Path("benchmarks/deliberation_results.json").read_text())
          agg = data.get("aggregate", {})
          variants = agg.get("variants", {})
          panel = agg.get("evaluator_panel", {})
          print("## Deliberation benchmark")
          print()
          print(f"Cases: {agg.get('runs')}  |  Valid blind evaluations: {agg.get('valid_evaluations')}")
          print(
              "Evaluator panel: "
              f"avg agreement={panel.get('avg_agreement')}, "
              f"unanimous fraction={panel.get('unanimous_fraction')}, "
              f"avg valid evaluators={panel.get('avg_valid_evaluators')}, "
              f"avg evaluator cost=${panel.get('avg_evaluator_cost_usd')}"
          )
          print()
          print("| Variant | Quality | Win rate | Avg calls | Avg latency ms | Avg cost USD |")
          print("|---|---:|---:|---:|---:|---:|")
          for label in ("solo", "fusion-current", "fusion-deliberation"):
              row = variants.get(label, {})
              def fmt(value, digits=3):
                  return "n/a" if value is None else f"{float(value):.{digits}f}"
              print(
                  f"| {label} | {fmt(row.get('quality'))} | {fmt(row.get('win_rate'))} | "
                  f"{fmt(row.get('avg_calls'), 1)} | {fmt(row.get('avg_latency_ms'), 0)} | {fmt(row.get('avg_cost_usd'), 4)} |"
              )
          print()
          print(f"Deliberation quality delta vs current Fusion: {agg.get('deliberation_quality_delta')}")

          gate_path = Path("benchmarks/deliberation_gate.json")
          if gate_path.exists():
              gate = json.loads(gate_path.read_text())
              print()
              print(f"### Promotion gate: **{gate.get('status', 'UNKNOWN')}**")
              failed = [name for name, row in gate.get('checks', {}).items() if not row.get('passed')]
              if failed:
                  print("Failed checks: " + ", ".join(failed))
              metrics = gate.get("metrics", {})
              print(
                  "Efficiency ratios (report-only unless explicitly gated): "
                  f"latency={metrics.get('latency_ratio')}, cost={metrics.get('cost_ratio')}"
              )
          PY

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deliberation-benchmark-${{ github.run_id }}
          path: |
            benchmarks/deliberation_results.json
            benchmarks/deliberation_gate.json
          if-no-files-found: warn
          retention-days: 30
