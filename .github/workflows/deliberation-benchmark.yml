name: Deliberation Benchmark

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of benchmark cases (use 40 for the full suite)"
        required: true
        default: "3"
      preset:
        description: "API-capable Fusion preset"
        required: true
        default: "mixed"
      baseline:
        description: "Single-model baseline member spec"
        required: true
        default: "or:anthropic/claude-opus-5"
      judge:
        description: "Fusion judge member spec"
        required: true
        default: "or:anthropic/claude-opus-5"
      drafter:
        description: "Fusion drafter member spec"
        required: true
        default: "or:anthropic/claude-opus-5"
      evaluator:
        description: "Blind external evaluator member spec"
        required: true
        default: "or:openai/gpt-5.6-luna"
      scouts:
        description: "Deliberation scouts"
        required: true
        default: "4"
      branches:
        description: "Bounded branch expansions"
        required: true
        default: "3"
      critics:
        description: "Targeted critics"
        required: true
        default: "2"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require OpenRouter key
        shell: bash
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "OPENROUTER_API_KEY repository secret is required for this workflow." >&2
            exit 2
          fi

      - name: Validate benchmark configuration
        run: |
          python scripts/deliberation_benchmark.py \
            --dry-run \
            --limit "${{ inputs.limit }}" \
            --preset "${{ inputs.preset }}" \
            --baseline "${{ inputs.baseline }}" \
            --judge "${{ inputs.judge }}" \
            --drafter "${{ inputs.drafter }}" \
            --evaluator "${{ inputs.evaluator }}" \
            --scouts "${{ inputs.scouts }}" \
            --branches "${{ inputs.branches }}" \
            --critics "${{ inputs.critics }}"

      - name: Run blind benchmark
        run: |
          python scripts/deliberation_benchmark.py \
            --limit "${{ inputs.limit }}" \
            --preset "${{ inputs.preset }}" \
            --baseline "${{ inputs.baseline }}" \
            --judge "${{ inputs.judge }}" \
            --drafter "${{ inputs.drafter }}" \
            --evaluator "${{ inputs.evaluator }}" \
            --scouts "${{ inputs.scouts }}" \
            --branches "${{ inputs.branches }}" \
            --critics "${{ inputs.critics }}" \
            --output benchmarks/deliberation_results.json

      - name: Write benchmark summary
        if: always()
        shell: bash
        run: |
          if [ ! -f benchmarks/deliberation_results.json ]; then
            echo "## Deliberation benchmark" >> "$GITHUB_STEP_SUMMARY"
            echo "No result file was produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          data = json.loads(Path("benchmarks/deliberation_results.json").read_text())
          agg = data.get("aggregate", {})
          variants = agg.get("variants", {})
          print("## Deliberation benchmark")
          print()
          print(f"Cases: {agg.get('runs')}  |  Valid blind evaluations: {agg.get('valid_evaluations')}")
          print()
          print("| Variant | Quality | Win rate | Avg calls | Avg latency ms | Avg cost USD |")
          print("|---|---:|---:|---:|---:|---:|")
          for label in ("solo", "fusion-current", "fusion-deliberation"):
              row = variants.get(label, {})
              def fmt(value, digits=3):
                  return "n/a" if value is None else f"{float(value):.{digits}f}"
              print(
                  f"| {label} | {fmt(row.get('quality'))} | {fmt(row.get('win_rate'))} | "
                  f"{fmt(row.get('avg_calls'), 1)} | {fmt(row.get('avg_latency_ms'), 0)} | {fmt(row.get('avg_cost_usd'), 4)} |"
              )
          print()
          print(f"Deliberation quality delta vs current Fusion: {agg.get('deliberation_quality_delta')}")
          PY

      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deliberation-benchmark-${{ github.run_id }}
          path: benchmarks/deliberation_results.json
          if-no-files-found: warn
          retention-days: 30
